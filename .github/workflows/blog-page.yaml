name: Deploy Blog Page

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/blog-page.yaml'
      - '.github/blog-app/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/blog-page.yaml'
      - '.github/blog-app/**'
#   workflow_dispatch:
#   schedule:
#     # 每天北京时间上午9点（UTC时间1点）自动更新一次
#     - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: full
        
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: .github/blog-app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .github/blog-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .github/blog-app
        run: pnpm install --frozen-lockfile

      - name: Build blog page
        working-directory: .github/blog-app
        run: |
          python3 scripts/generate-blog-data.py
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.github/blog-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
