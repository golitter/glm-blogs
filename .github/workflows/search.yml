name: Deploy Search Page

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Build search page
        run: |
          mkdir -p dist
          cat > dist/index.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GLM Blogs 搜索</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      padding: 20px;
                  }
                  .container {
                      background: white;
                      padding: 50px;
                      border-radius: 20px;
                      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
                      width: 100%;
                      max-width: 600px;
                      text-align: center;
                  }
                  h1 {
                      color: #333;
                      margin-bottom: 15px;
                      font-size: 2.8em;
                      font-weight: 700;
                  }
                  .subtitle {
                      color: #666;
                      margin-bottom: 40px;
                      font-size: 1.2em;
                      line-height: 1.5;
                  }
                  .search-container {
                      position: relative;
                      margin-bottom: 40px;
                  }
                  .search-box {
                      width: 100%;
                      padding: 20px 70px 20px 30px;
                      font-size: 18px;
                      border: 3px solid #e1e8ed;
                      border-radius: 50px;
                      outline: none;
                      transition: all 0.3s ease;
                      background: #f8f9fa;
                  }
                  .search-box:focus {
                      border-color: #667eea;
                      background: white;
                      box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
                  }
                  .search-btn {
                      position: absolute;
                      right: 10px;
                      top: 50%;
                      transform: translateY(-50%);
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      border: none;
                      border-radius: 50%;
                      width: 50px;
                      height: 50px;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      transition: all 0.3s ease;
                  }
                  .search-btn:hover {
                      transform: translateY(-50%) scale(1.1);
                      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
                  }
                  .search-btn svg {
                      width: 22px;
                      height: 22px;
                      fill: white;
                  }
                  .search-options {
                      display: flex;
                      gap: 15px;
                      margin-bottom: 35px;
                      justify-content: center;
                      flex-wrap: wrap;
                  }
                  .search-option {
                      padding: 12px 20px;
                      border: 2px solid #e1e8ed;
                      border-radius: 25px;
                      background: white;
                      cursor: pointer;
                      transition: all 0.3s ease;
                      font-size: 15px;
                      font-weight: 500;
                  }
                  .search-option:hover {
                      border-color: #667eea;
                      background: #f8f9ff;
                  }
                  .search-option.active {
                      background: #667eea;
                      color: white;
                      border-color: #667eea;
                  }
                  .quick-links {
                      margin-top: 40px;
                      padding-top: 35px;
                      border-top: 2px solid #e1e8ed;
                  }
                  .quick-links h3 {
                      color: #333;
                      margin-bottom: 20px;
                      font-size: 1.3em;
                      font-weight: 600;
                  }
                  .link-buttons {
                      display: flex;
                      gap: 12px;
                      flex-wrap: wrap;
                      justify-content: center;
                  }
                  .link-btn {
                      padding: 10px 18px;
                      background: #f8f9fa;
                      border: 2px solid #e1e8ed;
                      border-radius: 25px;
                      text-decoration: none;
                      color: #333;
                      font-size: 14px;
                      font-weight: 500;
                      transition: all 0.3s ease;
                  }
                  .link-btn:hover {
                      background: #667eea;
                      color: white;
                      border-color: #667eea;
                      transform: translateY(-2px);
                  }
                  .search-tips {
                      margin-top: 30px;
                      padding: 20px;
                      background: #f8f9fa;
                      border-radius: 12px;
                      border-left: 4px solid #667eea;
                  }
                  .search-tips h4 {
                      color: #333;
                      margin-bottom: 10px;
                      font-size: 1.1em;
                  }
                  .search-tips ul {
                      list-style: none;
                      text-align: left;
                      color: #666;
                      font-size: 14px;
                  }
                  .search-tips li {
                      margin-bottom: 5px;
                      padding-left: 20px;
                      position: relative;
                  }
                  .search-tips li:before {
                      content: "•";
                      color: #667eea;
                      position: absolute;
                      left: 0;
                      font-weight: bold;
                  }
                  .loading {
                      display: none;
                      text-align: center;
                      color: #667eea;
                      font-size: 16px;
                      margin-top: 20px;
                  }
                  .loading.show {
                      display: block;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📚 GLM Blogs</h1>
                  <p class="subtitle">在GitHub仓库中搜索你的技术博客文件</p>
                  
                  <div class="search-options">
                      <div class="search-option active" data-type="filename" onclick="setSearchType('filename')">
                          📄 文件名
                      </div>
                      <div class="search-option" data-type="content" onclick="setSearchType('content')">
                          🔍 内容
                      </div>
                      <div class="search-option" data-type="path" onclick="setSearchType('path')">
                          📁 路径
                      </div>
                  </div>
                  
                  <div class="search-container">
                      <input 
                          type="text" 
                          class="search-box" 
                          placeholder="输入搜索关键词..." 
                          id="searchInput"
                          autocomplete="off"
                      >
                      <button class="search-btn" onclick="performSearch()">
                          <svg viewBox="0 0 24 24">
                              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                          </svg>
                      </button>
                  </div>
                  
                  <div class="loading" id="loading">🔍 正在跳转到GitHub搜索...</div>
                  
                  <div class="quick-links">
                      <h3>快速访问</h3>
                      <div class="link-buttons">
                          <a href="https://github.com/golitter/glm-blogs" class="link-btn" target="_blank">🏠 仓库首页</a>
                          <a href="https://github.com/golitter/glm-blogs/commits/main" class="link-btn" target="_blank">📝 提交历史</a>
                          <a href="https://github.com/golitter/glm-blogs/issues" class="link-btn" target="_blank">🐛 Issues</a>
                          <a href="https://github.com/golitter/glm-blogs/pulls" class="link-btn" target="_blank">🔄 Pull Requests</a>
                      </div>
                  </div>
                  
                  <div class="search-tips">
                      <h4>💡 搜索技巧</h4>
                      <ul>
                          <li>文件名搜索：直接输入文件名或扩展名</li>
                          <li>内容搜索：输入文件中的关键词</li>
                          <li>路径搜索：输入目录名或路径</li>
                          <li>支持空格分隔多个关键词</li>
                          <li>搜索结果将在新标签页中打开</li>
                      </ul>
                  </div>
              </div>

              <script>
                  let searchType = 'filename';
                  const searchInput = document.getElementById('searchInput');
                  const loading = document.getElementById('loading');
                  
                  // 设置搜索类型
                  function setSearchType(type) {
                      searchType = type;
                      document.querySelectorAll('.search-option').forEach(opt => {
                          opt.classList.remove('active');
                      });
                      document.querySelector(`[data-type="${type}"]`).classList.add('active');
                      
                      // 更新占位符
                      if (type === 'filename') {
                          searchInput.placeholder = '输入文件名或扩展名...';
                      } else if (type === 'content') {
                          searchInput.placeholder = '输入文件内容关键词...';
                      } else if (type === 'path') {
                          searchInput.placeholder = '输入目录路径...';
                      }
                  }
                  
                  // 构建GitHub搜索URL
                  function buildSearchUrl(query, type) {
                      const baseUrl = 'https://github.com/golitter/glm-blogs/search';
                      const encodedQuery = encodeURIComponent(query);
                      
                      switch(type) {
                          case 'filename':
                              return `${baseUrl}?q=${encodedQuery}+filename%3A${encodedQuery}`;
                          case 'content':
                              return `${baseUrl}?q=${encodedQuery}`;
                          case 'path':
                              return `${baseUrl}?q=${encodedQuery}+path%3A${encodedQuery}`;
                          default:
                              return `${baseUrl}?q=${encodedQuery}`;
                      }
                  }
                  
                  // 执行搜索
                  function performSearch() {
                      const query = searchInput.value.trim();
                      
                      if (!query) {
                          searchInput.focus();
                          searchInput.style.borderColor = '#ff6b6b';
                          setTimeout(() => {
                              searchInput.style.borderColor = '#e1e8ed';
                          }, 2000);
                          return;
                      }
                      
                      // 显示加载状态
                      loading.classList.add('show');
                      
                      // 构建搜索URL
                      const searchUrl = buildSearchUrl(query, searchType);
                      
                      // 延迟跳转，让用户看到加载状态
                      setTimeout(() => {
                          window.open(searchUrl, '_blank');
                          loading.classList.remove('show');
                      }, 500);
                  }
                  
                  // 回车搜索
                  searchInput.addEventListener('keypress', (e) => {
                      if (e.key === 'Enter') {
                          performSearch();
                      }
                  });
                  
                  // 实时输入提示（可选）
                  searchInput.addEventListener('input', (e) => {
                      if (e.target.value.trim()) {
                          searchInput.style.borderColor = '#667eea';
                      } else {
                          searchInput.style.borderColor = '#e1e8ed';
                      }
                  });
                  
                  // 页面加载完成后聚焦搜索框
                  window.addEventListener('load', () => {
                      searchInput.focus();
                  });
                  
                  // 添加键盘快捷键
                  document.addEventListener('keydown', (e) => {
                      // Ctrl/Cmd + K 聚焦搜索框
                      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                          e.preventDefault();
                          searchInput.focus();
                          searchInput.select();
                      }
                  });
              </script>
          </body>
          </html>
          HTML_EOF
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
