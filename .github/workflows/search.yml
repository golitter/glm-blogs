name: Deploy Search Page

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/search.yml'
      - 'index.html'  # 修改这里
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/search.yml'
      - 'index.html'  # 修改这里
  workflow_dispatch:
  schedule:
    # 每天北京时间上午9点（UTC时间1点）自动更新一次
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: full
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Get repository stats
        id: stats
        run: |
          # 设置时区为中国东八区
          export TZ='Asia/Shanghai'
          
          # 统计markdown文件数量
          MD_COUNT=$(find . -name "*.md" -not -path "./.git/*" -not -path "./dist/*" | wc -l)
          echo "md_count=$MD_COUNT" >> $GITHUB_OUTPUT
          
          # 使用git log获取最近提交的文件
          echo "Getting recent files using git log..."
          
          # 生成最近文件HTML
          echo "recent_files_html<<EOF" >> $GITHUB_OUTPUT
          
          # 获取最近10次提交中涉及的md文件，按提交时间排序
          git log --name-only --pretty=format:"%ct|%H" -20 -- "*.md" | \
          awk '
          BEGIN { 
            count = 0; 
            current_time = "";
            current_hash = "";
          }
          /^[0-9]+\|/ { 
            split($0, parts, "|");
            current_time = parts[1]; 
            current_hash = parts[2];
            next;
          }
          /^[^0-9]/ { 
            if (current_time != "" && $0 ~ /\.md$/ && !seen[$0]++) {
              print current_time "|" current_hash "|" $0;
              count++;
              if (count >= 5) exit;
            }
          }
          ' | sort -nr | while IFS='|' read -r timestamp commit_hash filepath; do
            
            if [[ -n "$filepath" && -f "$filepath" ]]; then
              # 转换时间戳为中国时间格式
              DATE=$(TZ='Asia/Shanghai' date -d "@$timestamp" "+%Y-%m-%d %H:%M")
              # 获取相对路径（去掉开头的./）
              REL_PATH=${filepath#./}
              # 获取文件名
              FILENAME=$(basename "$filepath")
              # 构建GitHub URL - 使用master分支
              GITHUB_URL="https://github.com/golitter/glm-blogs/blob/master/$REL_PATH"
              
              # 生成HTML
              echo "<div class=\"recent-file-item\">" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-name\" onclick=\"window.open('$GITHUB_URL', '_blank')\">$FILENAME</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-path\">$REL_PATH</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-date\">$DATE</div>" >> $GITHUB_OUTPUT
              echo "</div>" >> $GITHUB_OUTPUT
              
              echo "Added: $FILENAME ($DATE)"
            fi
          done
          
          # 如果git log方法没有获取到足够的文件，使用备用方法
          RECENT_FILES_COUNT=$(grep -c "recent-file-item" <<< "$(cat $GITHUB_OUTPUT | sed -n '/recent_files_html<<EOF/,/EOF/p' | grep -v 'recent_files_html<<EOF' | grep -v 'EOF')" || echo "0")
          if [[ $RECENT_FILES_COUNT -lt 3 ]]; then
            echo "Using fallback method..."
            echo "recent_files_html<<EOF" >> $GITHUB_OUTPUT
            
            # 备用方法：按文件名排序
            find . -name "*.md" -not -path "./.git/*" -not -path "./dist/*" -exec stat -c "%Y %n" {} \; | \
            sort -k1 -nr | head -5 | while read timestamp filepath; do
              
              # 转换时间戳为中国时间格式
              DATE=$(TZ='Asia/Shanghai' date -d "@$timestamp" "+%Y-%m-%d %H:%M")
              # 获取相对路径（去掉开头的./）
              REL_PATH=${filepath#./}
              # 获取文件名
              FILENAME=$(basename "$filepath")
              # 构建GitHub URL - 使用master分支
              GITHUB_URL="https://github.com/golitter/glm-blogs/blob/master/$REL_PATH"
              
              # 生成HTML
              echo "<div class=\"recent-file-item\">" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-name\" onclick=\"window.open('$GITHUB_URL', '_blank')\">$FILENAME</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-path\">$REL_PATH</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-date\">$DATE</div>" >> $GITHUB_OUTPUT
              echo "</div>" >> $GITHUB_OUTPUT
            done
          fi
          
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Markdown files: $MD_COUNT"
        
      - name: Build search page
        run: |
          mkdir -p dist
          
          # 获取当前中国时间作为更新时间
          UPDATE_TIME=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          
          # 检查模板文件是否存在
          if [[ ! -f "index.html" ]]; then
            echo "Error: index.html template file not found!"
            exit 1
          fi
          
          # 使用envsubst替换模板中的变量
          export MD_COUNT="${{ steps.stats.outputs.md_count }}"
          export RECENT_FILES_HTML="${{ steps.stats.outputs.recent_files_html }}"
          export UPDATE_TIME="$UPDATE_TIME"
          
          # 从模板文件生成最终HTML
          envsubst < index.html > dist/index.html
          
          echo "Page built successfully with $MD_COUNT markdown files"
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
