name: Deploy Search Page

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/search.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '.github/workflows/search.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: full
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Get repository stats
        id: stats
        run: |
          MD_COUNT=$(find . -type f -name "*.md" -not -path "./.git/*" -not -path "./dist/*" | wc -l)
          echo "md_count=$MD_COUNT" >> $GITHUB_OUTPUT

          echo "recent_files_html<<EOF" >> $GITHUB_OUTPUT
          find . -type f -name "*.md" -not -path "./.git/*" -not -path "./dist/*" -print0 | \
            xargs -0 stat -c '%Y\t%n' | \
            sort -nr | head -n 5 | \
            while IFS=$'\t' read -r timestamp filepath; do
              DATE=$(TZ='Asia/Shanghai' date -d "@$timestamp" "+%Y-%m-%d %H:%M:%S CST")
              REL_PATH=${filepath#./}
              FILENAME=$(basename "$filepath")
              GITHUB_URL="https://github.com/golitter/glm-blogs/blob/master/$REL_PATH"

              echo "<div class=\"recent-file-item\">" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-name\" onclick=\"window.open('$GITHUB_URL', '_blank')\">$FILENAME</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-path\">$REL_PATH</div>" >> $GITHUB_OUTPUT
              echo "  <div class=\"recent-file-date\">$DATE</div>" >> $GITHUB_OUTPUT
              echo "</div>" >> $GITHUB_OUTPUT
            done
          echo "EOF" >> $GITHUB_OUTPUT
        
      - name: Build search page
        run: |
          mkdir -p dist
          UPDATE_TIME=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S CST")

          cat > dist/index.html << HTML_EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GLM Blogs 搜索</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      padding: 20px;
                  }
                  .main-wrapper {
                      display: flex;
                      gap: 20px;
                      max-width: 900px;
                      width: 100%;
                      align-items: flex-start;
                  }
                  .sidebar {
                      background: white;
                      padding: 30px;
                      border-radius: 20px;
                      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
                      width: 280px;
                      flex-shrink: 0;
                  }
                  .container {
                      background: white;
                      padding: 50px;
                      border-radius: 20px;
                      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
                      flex: 1;
                      text-align: center;
                  }
                  .stats-card {
                      background: #f8f9fa;
                      padding: 20px;
                      border-radius: 12px;
                      margin-bottom: 25px;
                      border-left: 4px solid #667eea;
                  }
                  .stats-number {
                      font-size: 2.5em;
                      font-weight: 700;
                      color: #667eea;
                      margin-bottom: 5px;
                  }
                  .recent-files {
                      background: #f8f9fa;
                      padding: 20px;
                      border-radius: 12px;
                      border-left: 4px solid #28a745;
                  }
                  .recent-file-item {
                      margin-bottom: 12px;
                      padding-bottom: 12px;
                      border-bottom: 1px solid #e1e8ed;
                  }
                  .recent-file-name {
                      font-weight: 500;
                      color: #333;
                      font-size: 14px;
                      margin-bottom: 4px;
                      cursor: pointer;
                      transition: color 0.2s ease;
                  }
                  .recent-file-name:hover {
                      color: #667eea;
                  }
                  h1 {
                      color: #333;
                      margin-bottom: 15px;
                      font-size: 2.8em;
                      font-weight: 700;
                  }
                  .search-container {
                      position: relative;
                      margin-bottom: 40px;
                  }
                  .search-box {
                      width: 100%;
                      padding: 20px 70px 20px 30px;
                      font-size: 18px;
                      border: 3px solid #e1e8ed;
                      border-radius: 50px;
                      outline: none;
                      transition: all 0.3s ease;
                      background: #f8f9fa;
                  }
                  .search-box:focus {
                      border-color: #667eea;
                      background: white;
                      box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
                  }
                  .search-btn {
                      position: absolute;
                      right: 10px;
                      top: 50%;
                      transform: translateY(-50%);
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      border: none;
                      border-radius: 50%;
                      width: 50px;
                      height: 50px;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
              </style>
          </head>
          <body>
              <div class="main-wrapper">
                  <div class="sidebar">
                      <div class="stats-card">
                          <h3>📊 仓库统计</h3>
                          <div class="stats-number">${{ steps.stats.outputs.md_count }}</div>
                          <div class="stats-label">Markdown 文件</div>
                      </div>
                      <div class="recent-files">
                          <h3>🕒 最近更新</h3>
                          <div id="recentFilesList">
                              ${{ steps.stats.outputs.recent_files_html }}
                          </div>
                      </div>
                  </div>

                  <div class="container">
                      <h1>📚 GLM Blogs</h1>
                      <p class="subtitle">在 GitHub 仓库中搜索技术博客内容</p>

                      <form id="searchForm" onsubmit="performSearch(event)">
                          <div class="search-container">
                              <input type="text" class="search-box" placeholder="输入搜索关键词..." id="searchInput" name="q" autocomplete="off" required>
                              <button type="submit" class="search-btn">
                                  <svg viewBox="0 0 24 24">
                                      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                                  </svg>
                              </button>
                          </div>
                      </form>
                  </div>
              </div>

              <div class="update-info">更新时间: $UPDATE_TIME</div>

              <script>
                  function performSearch(event) {
                      event.preventDefault();
                      const query = document.getElementById('searchInput').value.trim();
                      if (!query) return;

                      const repoQuery = 'repo:golitter/glm-blogs ' + query;
                      const searchUrl = 'https://github.com/search?q=' + encodeURIComponent(repoQuery) + '&type=code';
                      window.open(searchUrl, '_blank');
                  }

                  window.addEventListener('load', () => {
                      document.getElementById('searchInput').focus();
                  });
              </script>
          </body>
          </html>
          HTML_EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
