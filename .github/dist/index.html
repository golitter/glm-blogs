<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Golemon Blogs</title>
              <link rel="icon" type="image/png" href="blog-icon.png">
              <style>
                  :root {
                      --bg: #f5f8fb;
                      --surface: #ffffff;
                      --surface-soft: #f0f5f8;
                      --text: #182132;
                      --muted: #667287;
                      --line: #dce7ef;
                      --blue: #4da9dc;
                      --blue-dark: #276f98;
                      --gold: #af7a31;
                      --shadow: 0 12px 30px rgba(26, 44, 69, 0.06);
                  }
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                      color: var(--text);
                      background: var(--bg);
                      min-height: 100vh;
                      font-size: 16px;
                  }
                  a { color: inherit; }
                  .site-header {
                      position: sticky;
                      top: 0;
                      z-index: 10;
                      border-bottom: 1px solid rgba(216, 229, 238, 0.82);
                      background: rgba(255, 255, 255, 0.9);
                      backdrop-filter: blur(10px);
                  }
                  .nav {
                      max-width: 1120px;
                      width: 100%;
                      margin: 0 auto;
                      padding: 0 24px;
                      min-height: 64px;
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      gap: 24px;
                  }
                  .brand-group {
                      display: inline-flex;
                      align-items: center;
                      gap: 12px;
                      min-width: 0;
                  }
                  .brand {
                      display: inline-flex;
                      align-items: center;
                      gap: 9px;
                      text-decoration: none;
                      font-weight: 700;
                      letter-spacing: 0;
                  }
                  .brand-avatar {
                      width: 28px;
                      height: 28px;
                      border-radius: 50%;
                      object-fit: cover;
                      border: 1px solid var(--line);
                      background: var(--surface-soft);
                  }
                  .nav-stat {
                      display: inline-flex;
                      align-items: center;
                      gap: 4px;
                      padding: 4px 8px;
                      border: 1px solid var(--line);
                      border-radius: 999px;
                      color: var(--muted);
                      background: var(--surface-soft);
                      font-size: 12px;
                      line-height: 1;
                      white-space: nowrap;
                  }
                  .nav-stat strong {
                      color: var(--blue-dark);
                      font-size: 13px;
                      font-weight: 760;
                  }
                  .nav-links {
                      display: flex;
                      align-items: center;
                      gap: 18px;
                      color: var(--muted);
                      font-size: 14px;
                  }
                  .nav-links a {
                      padding: 8px 2px;
                      text-decoration: none;
                  }
                  .nav-links a:hover {
                      color: var(--blue-dark);
                  }
                  .page-shell {
                      max-width: 1400px;
                      width: 100%;
                      margin: 0 auto;
                      padding: 34px 24px 46px;
                      display: grid;
                      grid-template-columns: 200px minmax(0, 960px) 200px;
                      gap: 20px;
                      align-items: start;
                      min-height: calc(100vh - 64px);
                  }
                  .page {
                      width: 100%;
                  }
                  .hero {
                      display: grid;
                      grid-template-columns: minmax(0, 1fr);
                      gap: 18px;
                      align-items: end;
                      margin-bottom: 24px;
                  }
                  h1 {
                      font-size: 34px;
                      line-height: 1.18;
                      font-weight: 760;
                      letter-spacing: 0;
                      margin-bottom: 10px;
                  }
                  .subtitle {
                      color: var(--muted);
                      font-size: 15px;
                      line-height: 1.72;
                      max-width: 760px;
                  }
                  .search-panel {
                      grid-column: 1 / -1;
                      margin-top: 2px;
                      border: 1px solid var(--line);
                      border-radius: 8px;
                      background: var(--surface);
                      padding: 8px;
                      box-shadow: var(--shadow);
                  }
                  .search-container {
                      position: relative;
                      display: flex;
                      align-items: center;
                  }
                  .search-box {
                      width: 100%;
                      height: 52px;
                      padding: 0 58px 0 16px;
                      color: var(--text);
                      font-size: 16px;
                      border: 1px solid transparent;
                      border-radius: 6px;
                      outline: none;
                      background: var(--surface-soft);
                      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
                  }
                  .search-box:focus {
                      border-color: rgba(96, 183, 232, 0.92);
                      background: #ffffff;
                      box-shadow: 0 0 0 4px rgba(96, 183, 232, 0.16);
                  }
                  .search-box::placeholder {
                      color: #8795a8;
                  }
                  .search-btn {
                      position: absolute;
                      right: 7px;
                      top: 50%;
                      transform: translateY(-50%);
                      width: 38px;
                      height: 38px;
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      border: 1px solid rgba(36, 121, 168, 0.18);
                      border-radius: 6px;
                      color: white;
                      background: linear-gradient(180deg, #2c86b6, var(--blue-dark));
                      cursor: pointer;
                      transition: background 0.2s ease, transform 0.2s ease;
                  }
                  .search-btn:hover {
                      background: #1d668e;
                  }
                  .search-btn:active {
                      transform: translateY(-50%) scale(0.98);
                  }
                  .search-btn svg {
                      width: 20px;
                      height: 20px;
                      fill: currentColor;
                  }
                  .content-grid {
                      display: grid;
                      grid-template-columns: 220px minmax(0, 1fr);
                      gap: 22px;
                      align-items: start;
                  }
                  .category-panel,
                  .recent-panel,
                  .side-card {
                      border: 1px solid var(--line);
                      border-radius: 8px;
                      background: var(--surface);
                      padding: 18px;
                      box-shadow: var(--shadow);
                  }
                  .category-panel h2,
                  .recent-panel h2 {
                      margin-bottom: 14px;
                      font-size: 16px;
                      font-weight: 720;
                      letter-spacing: 0;
                  }
                  .category-panel-header {
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      gap: 12px;
                      margin-bottom: 14px;
                  }
                  .category-panel-header h2 {
                      margin-bottom: 0;
                  }
                  .panel-title-link {
                      display: inline-flex;
                      align-items: center;
                      gap: 6px;
                      color: inherit;
                      text-decoration: none;
                  }
                  .panel-title-link:hover {
                      color: var(--blue-dark);
                  }
                  .collapse-categories-btn {
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      min-height: 28px;
                      padding: 0 9px;
                      border: 1px solid var(--line);
                      border-radius: 999px;
                      color: var(--muted);
                      background: var(--surface-soft);
                      font: inherit;
                      font-size: 12px;
                      font-weight: 650;
                      cursor: pointer;
                      white-space: nowrap;
                      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
                  }
                  .collapse-categories-btn:hover {
                      border-color: rgba(39, 111, 152, 0.28);
                      color: var(--blue-dark);
                      background: #ffffff;
                  }
                  .category-tree {
                      display: grid;
                      gap: 4px;
                  }
                  .category-node {
                      border-radius: 6px;
                  }
                  .category-node details {
                      display: grid;
                      gap: 2px;
                  }
                  .category-node details[open] > summary {
                      background: var(--surface-soft);
                      color: var(--blue-dark);
                  }
                  .category-node summary,
                  .category-file {
                      display: flex;
                      align-items: baseline;
                      justify-content: space-between;
                      gap: 8px;
                      width: 100%;
                      padding: 9px 10px;
                      border-radius: 6px;
                      text-decoration: none;
                      color: inherit;
                      transition: background 0.16s ease, color 0.16s ease;
                  }
                  .category-node summary {
                      cursor: pointer;
                      list-style: none;
                  }
                  .category-node summary::before {
                      content: ">";
                      color: var(--muted);
                      font-size: 11px;
                      transform: translateY(-1px);
                      transition: transform 0.16s ease;
                  }
                  .category-node details[open] > summary::before {
                      transform: rotate(90deg) translateX(1px);
                  }
                  .category-node summary::-webkit-details-marker {
                      display: none;
                  }
                  .category-node summary:hover,
                  .category-file:hover {
                      background: var(--surface-soft);
                      color: var(--blue-dark);
                  }
                  .category-node-label,
                  .category-file-title {
                      font-size: 14px;
                      font-weight: 680;
                  }
                  .category-count {
                      color: var(--muted);
                      font-size: 12px;
                      font-weight: 560;
                      white-space: nowrap;
                  }
                  .category-children {
                      display: grid;
                      gap: 2px;
                      margin: 2px 0 4px 12px;
                      padding-left: 10px;
                      border-left: 1px solid var(--line);
                  }
                  .category-file {
                      color: var(--muted);
                  }
                  .category-file-title {
                      color: inherit;
                      font-size: 13px;
                      line-height: 1.45;
                      word-break: break-word;
                  }
                  .recent-file-item {
                      display: block;
                      margin: 0 -8px;
                      padding: 14px 8px;
                      border-radius: 6px;
                      border-bottom: none;
                      text-decoration: none;
                      transition: background 0.16s ease;
                  }
                  .recent-file-item + .recent-file-item {
                      border-top: 1px solid rgba(216, 229, 238, 0.78);
                  }
                  .recent-file-item:hover {
                      background: var(--surface-soft);
                  }
                  .recent-file-name,
                  .recent-file-path,
                  .recent-file-date {
                      display: block;
                  }
                  .recent-file-name {
                      color: var(--text);
                      font-size: 15px;
                      font-weight: 680;
                      line-height: 1.45;
                  }
                  .file-suffix {
                      margin-left: 1px;
                      color: #9aa7b8;
                      font-size: 12px;
                      font-weight: 560;
                  }
                  .recent-file-item:hover .recent-file-name {
                      color: var(--blue-dark);
                  }
                  .recent-file-item:hover .file-suffix {
                      color: #8aa2b4;
                  }
                  .recent-file-path {
                      margin-top: 4px;
                      color: var(--muted);
                      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                      font-size: 12px;
                      line-height: 1.45;
                      word-break: break-all;
                  }
                  .recent-file-date {
                      margin-top: 5px;
                      color: var(--gold);
                      font-size: 12px;
                      font-weight: 650;
                  }
                  .about-block h2,
                  .search-note h2 {
                      margin-bottom: 9px;
                      font-size: 16px;
                      font-weight: 720;
                      letter-spacing: 0;
                  }
                  .about-block {
                      min-height: 0;
                  }
                  .rail-card {
                      margin-top: 92px;
                  }
                  .about-block p,
                  .search-note p {
                      color: var(--muted);
                      font-size: 13px;
                      line-height: 1.7;
                  }
                  .about-link {
                      color: var(--blue-dark);
                      font-size: 13px;
                      line-height: 1.7;
                      text-decoration: none;
                      word-break: break-all;
                  }
                  .about-link:hover {
                      text-decoration: underline;
                  }
                  .search-note code {
                      padding: 1px 5px;
                      border: 1px solid var(--line);
                      border-radius: 5px;
                      background: var(--surface-soft);
                      color: var(--text);
                      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                      font-size: 12px;
                  }
                  .right-rail {
                      min-height: 0;
                  }
                  .search-examples {
                      display: flex;
                      flex-wrap: wrap;
                      gap: 6px 10px;
                      margin-top: 10px;
                  }
                  .update-info {
                      margin-top: 16px;
                      color: var(--muted);
                      font-size: 12px;
                  }
                  .back-to-top {
                      position: fixed;
                      right: 24px;
                      bottom: 24px;
                      z-index: 20;
                      width: 42px;
                      height: 42px;
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      border: 1px solid rgba(39, 111, 152, 0.24);
                      border-radius: 50%;
                      color: #ffffff;
                      background: linear-gradient(180deg, #2c86b6, var(--blue-dark));
                      box-shadow: 0 12px 28px rgba(26, 44, 69, 0.18);
                      font: inherit;
                      font-size: 20px;
                      font-weight: 760;
                      line-height: 1;
                      cursor: pointer;
                      opacity: 0;
                      pointer-events: none;
                      transform: translateY(8px);
                      transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease;
                  }
                  .back-to-top.is-visible {
                      opacity: 1;
                      pointer-events: auto;
                      transform: translateY(0);
                  }
                  .back-to-top:hover {
                      background: #1d668e;
                  }
                  @media (max-width: 1120px) {
                      .page-shell {
                          max-width: 1120px;
                          grid-template-columns: 1fr;
                      }
                      .page {
                          order: 1;
                      }
                      .rail-card {
                          margin-top: 0;
                      }
                      .about-block {
                          order: 2;
                      }
                      .search-note {
                          order: 3;
                      }
                      .content-grid {
                          grid-template-columns: 1fr;
                      }
                  }
                  @media (max-width: 800px) {
                      .nav {
                          min-height: 58px;
                      }
                      .nav-links {
                          gap: 12px;
                          font-size: 13px;
                      }
                      .page {
                          width: 100%;
                      }
                      .page-shell {
                          grid-template-columns: 1fr;
                          padding-top: 28px;
                      }
                      .right-rail {
                          min-height: 0;
                          display: block;
                      }
                      .hero {
                          grid-template-columns: 1fr;
                      }
                  }
                  @media (max-width: 560px) {
                      .nav {
                          align-items: flex-start;
                          flex-direction: column;
                          gap: 8px;
                          padding-top: 14px;
                          padding-bottom: 14px;
                      }
                      .nav-links {
                          flex-wrap: wrap;
                      }
                      .brand-group {
                          flex-wrap: wrap;
                          gap: 8px;
                      }
                      h1 {
                          font-size: 31px;
                      }
                      .subtitle {
                          font-size: 15px;
                      }
                      .search-box {
                          height: 54px;
                          font-size: 16px;
                      }
                      .back-to-top {
                          right: 16px;
                          bottom: 16px;
                          width: 38px;
                          height: 38px;
                          font-size: 18px;
                      }
                  }
              </style>
          </head>
          <body>
              <header class="site-header">
                  <nav class="nav" aria-label="Primary">
                      <div class="brand-group">
                          <a class="brand" href="https://golitter.github.io/glm-blogs/">
                              <img class="brand-avatar" src="blog-icon.png" alt="">
                              <span>Golemon Blogs</span>
                          </a>
                          <span class="nav-stat">博客文章 <strong>__MD_COUNT__</strong></span>
                      </div>
                      <div class="nav-links">
                          <a href="https://github.com/golitter/glm-blogs" target="_blank" rel="noopener noreferrer">Repository</a>
                          <a href="https://github.com/golitter/glm-blogs/commits/master/" target="_blank" rel="noopener noreferrer">Commits</a>
                          <a href="https://github.com/golitter/glm-blogs/issues" target="_blank" rel="noopener noreferrer">Issues</a>
                      </div>
                  </nav>
              </header>

              <div class="page-shell">
                  <aside class="side-card rail-card about-block" aria-labelledby="about-title">
                      <h2 id="about-title">About</h2>
                      <a class="about-link" href="https://github.com/golitter" target="_blank" rel="noopener noreferrer">https://github.com/golitter</a>
                  </aside>

                  <main class="page">
                      <section class="hero">
                          <form id="searchForm" onsubmit="performSearch(event)" class="search-panel">
                              <div class="search-container">
                                  <input
                                      type="text"
                                      class="search-box"
                                      placeholder="搜索 Markdown，例如 qwen、agent"
                                      id="searchInput"
                                      name="q"
                                      autocomplete="off"
                                      required
                                  >
                                  <button type="submit" class="search-btn" aria-label="搜索">
                                      <svg viewBox="0 0 24 24" aria-hidden="true">
                                          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                                      </svg>
                                  </button>
                              </div>
                          </form>
                      </section>

                      <div class="content-grid">
                          <aside class="category-panel" aria-labelledby="categories-title">
                              <div class="category-panel-header">
                                  <h2 id="categories-title">
                                      <a class="panel-title-link" href="https://github.com/golitter/glm-blogs" target="_blank" rel="noopener noreferrer">目录</a>
                                  </h2>
                                  <button type="button" class="collapse-categories-btn" id="collapseCategoriesBtn">全部折叠</button>
                              </div>
                              <div class="category-tree" id="categoryTree">
                                  __CATEGORY_TREE_HTML__
                              </div>
                          </aside>

                          <section class="recent-panel" aria-labelledby="recent-title">
                              <h2 id="recent-title">最近更新</h2>
                              <div id="recentFilesList">
                                  __RECENT_FILES_HTML__
                              </div>
                          </section>
                      </div>
                      <div class="update-info">
                          更新时间: __UPDATE_TIME__ (中国时间)
                      </div>
                  </main>

                  <aside class="side-card rail-card search-note" aria-labelledby="search-note-title">
                      <h2 id="search-note-title">搜索提示</h2>
                      <p>如果关键词中间有空格，请使用英文双引号；多个关键词可以用逗号隔开。</p>
                      <div class="search-examples">
                          <p>例如：<code>"go context"</code></p>
                          <p>例如：<code>agent, rag</code></p>
                      </div>
                  </aside>
              </div>
              <button type="button" class="back-to-top" id="backToTopBtn" aria-label="回到顶部">↑</button>
              <script>
                  // 执行搜索
                  function performSearch(event) {
                      event.preventDefault();
                      
                      const query = document.getElementById('searchInput').value.trim();
                      
                      if (!query) {
                          return;
                      }
                      
                      // 构建GitHub搜索URL
                      const baseUrl = 'https://github.com/search';
                      const repoQuery = 'repo:golitter/glm-blogs ' + query;
                      const searchUrl = baseUrl + '?q=' + encodeURIComponent(repoQuery) + '&type=code';
                      
                      // 在新标签页打开搜索结果
                      window.open(searchUrl, '_blank');
                  }
                  
                  // 页面加载完成后聚焦搜索框
                  window.addEventListener('load', () => {
                      document.getElementById('searchInput').focus();
                  });

                  const collapseCategoriesBtn = document.getElementById('collapseCategoriesBtn');
                  const categoryTree = document.getElementById('categoryTree');
                  const backToTopBtn = document.getElementById('backToTopBtn');

                  collapseCategoriesBtn.addEventListener('click', () => {
                      categoryTree.querySelectorAll('details[open]').forEach((details) => {
                          details.open = false;
                      });

                      document.querySelector('.category-panel').scrollIntoView({
                          behavior: 'smooth',
                          block: 'start',
                      });
                  });

                  function syncBackToTopButton() {
                      backToTopBtn.classList.toggle('is-visible', window.scrollY > 360);
                  }

                  window.addEventListener('scroll', syncBackToTopButton, { passive: true });
                  syncBackToTopButton();

                  backToTopBtn.addEventListener('click', () => {
                      window.scrollTo({
                          top: 0,
                          behavior: 'smooth',
                      });
                  });
                  
                  // 添加键盘快捷键
                  document.addEventListener('keydown', (e) => {
                      // Ctrl/Cmd + K 聚焦搜索框
                      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                          e.preventDefault();
                          document.getElementById('searchInput').focus();
                          document.getElementById('searchInput').select();
                      }
                  });
              </script>
          </body>
          </html>
